# audio-pipeline — https://spyware.andrewheschl.ca -> http://10.8.0.1:8098
#
# Source of truth is deploy/nginx/spyware.conf in ~/Documents/audio-pipeline;
# this is a copy, because server-nginx bind-mounts builds/nginx/conf.d. Edit
# there, then `make nginx` in that repo.
#
# Upstream is that stack's own web container (nginx serving the SPA and
# relaying the API on the same origin). Public rather than VPN-only: the
# recording clients are phones and glasses that are not always on WireGuard.
# Auth is bearer tokens, so nothing is readable without one.
server {
    listen 443 ssl;
    http2 on;
    server_name spyware.andrewheschl.ca;

    ssl_certificate     /etc/letsencrypt/live/andrewheschl.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andrewheschl.ca/privkey.pem;

    # Headroom only: audio arrives over the ingest websocket, not as an upload.
    client_max_body_size 64m;

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://10.8.0.1:8098;

        # Ingest is a long-lived websocket (/v1/sessions/{id}/stream) whose
        # protocol tolerates 300s of silence; the 60s default would cut a
        # connected client well before the app does.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Session playback is a Range-able stream of arbitrary length.
        # Buffering spools it to disk and turns every seek into a re-read.
        proxy_buffering off;
        proxy_cache     off;
    }
}
