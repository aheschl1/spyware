# Serves the built SPA and relays the API on the same origin — the production
# equivalent of the Vite dev proxy (frontend/vite.config.ts), so the browser
# never makes a cross-origin request and token-in-URL audio keeps working.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Headroom only: there are no HTTP upload endpoints. Audio arrives over the
    # ingest websocket, whose frames are not subject to this limit.
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(v1|health|stream-schema\.json|openapi\.json|docs|redoc) {
        # Resolved per request through Docker's embedded DNS. With a literal
        # upstream, nginx resolves once at startup: it refuses to boot while
        # `api` is down, and pins a stale IP across `compose up -d api`.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The ingest websocket lives at /v1/sessions/{id}/stream.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # nginx defaults to 60s, well under the protocol's own 300s idle
        # timeout (API_STREAM_IDLE_TIMEOUT_SECONDS) — a connected but quiet
        # client would be cut by the proxy rather than by the app.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Session audio is a Range-able stream of arbitrary length; buffering
        # spools it to disk and turns every seek into a full re-read.
        proxy_buffering         off;
        proxy_request_buffering off;
    }
}
